services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shodh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
      POSTGRES_DB: shodh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodh -d shodh"]
      interval: 3s
      retries: 30
    volumes: [db_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shodh:${POSTGRES_PASSWORD:-local_only_password}@db:5432/shodh
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:?Set DEV_AUTH_SECRET in .env}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh","-c","alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shodh:${POSTGRES_PASSWORD:-local_only_password}@db:5432/shodh
      RUNNER_URL: http://runner:8080
      RUNNER_TOKEN: ${RUNNER_TOKEN:-local_runner_token}
    depends_on:
      db: {condition: service_healthy}
      runner: {condition: service_started}
    command: ["python","-m","app.worker"]
  runner:
    build: .
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-local_runner_token}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn","app.runner:app","--host","0.0.0.0","--port","8080"]
volumes:
  db_data:
